<!-- opotai.diagrams: tools/sources/diagramas/III.9/ciclos-vida.svg sha256=02a2dcb1226d3d9d -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 716" width="900" height="716" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Modelos clásicos de ciclo de vida del software</title>
  <desc id="desc">Cuatro modelos: en cascada, fases secuenciales de requisitos a mantenimiento; en V, cada fase de desarrollo con su nivel de pruebas; incremental, varias entregas parciales; y en espiral, iteraciones por cuatro cuadrantes con análisis de riesgos.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
    <marker id="flv" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0" y="0" width="900" height="716" rx="14" fill="#ffffff"/>
  <text x="30" y="40" font-size="21" font-weight="700" fill="#1f2937">Modelos clásicos de ciclo de vida del software</text>
  <text x="30" y="62" font-size="13" fill="#475569">Cascada y V son secuenciales; incremental y espiral repiten el ciclo y entregan o reducen riesgos por etapas</text>
  <rect x="30" y="80" width="410" height="300" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
