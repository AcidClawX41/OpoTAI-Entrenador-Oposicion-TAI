<!-- opotai.diagrams: tools/sources/diagramas/IV.2/raid.svg sha256=13d5c50ec4295f50 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 578" width="900" height="578" role="img" aria-labelledby="t d">
  <title id="t">Niveles RAID 0, 1, 10, 5 y 6</title>
  <desc id="d">Reparto de bloques por disco. RAID 0: bandas sin redundancia (capacidad n × C, no tolera fallos). RAID 1: espejo (capacidad C, tolera n − 1 fallos). RAID 10: bandas sobre parejas en espejo (n × C / 2, un fallo por espejo). RAID 5: paridad distribuida rotando entre discos ((n − 1) × C, un fallo). RAID 6: doble paridad P y Q distribuida ((n − 2) × C, dos fallos).</desc>
  <rect x="0" y="0" width="900" height="578" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#1f2937">
