    <text x="681.5" y="118.5" font-size="14" text-anchor="middle">Aplicaciones</text>
    <rect x="627.0" y="147.0" width="109.0" height="51.0" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
    <text x="681.5" y="177.5" font-size="14" text-anchor="middle">SO invitado</text>
    <rect x="484" y="214" width="260" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="614.0" y="237.0" font-size="15" text-anchor="middle" font-weight="700">Hipervisor de tipo 2</text>
    <text x="614.0" y="255.0" font-size="13" text-anchor="middle" fill="#475569">VirtualBox, VMware Workstation</text>
    <rect x="754" y="58" width="110" height="206" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="809.0" y="159.0" font-size="14" text-anchor="middle">Apps</text>
    <text x="809.0" y="177.0" font-size="13" text-anchor="middle" fill="#475569">del anfitrión</text>
    <rect x="484" y="272" width="380" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="674.0" y="297.0" font-size="15" text-anchor="middle" font-weight="700">SO anfitrión</text>
    <text x="674.0" y="315.0" font-size="13" text-anchor="middle" fill="#475569">Windows, macOS o Linux</text>
    <rect x="484" y="334" width="380" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="674.0" y="357.0" font-size="15" text-anchor="middle" font-weight="700">Hardware físico</text>
    <text x="674.0" y="375.0" font-size="13" text-anchor="middle" fill="#475569">CPU, memoria, discos, red</text>
    <text x="484" y="410" font-size="13" fill="#475569">El hipervisor es una aplicación más del anfitrión:</text>
    <text x="484" y="430" font-size="13" fill="#475569">más capas y menos rendimiento. Uso: puesto y pruebas.</text>
  </g>
</svg>
