    <text x="546.5" y="177.5" font-size="14" text-anchor="middle">SO invitado</text>
    <rect x="619.0" y="58" width="125.0" height="150" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
