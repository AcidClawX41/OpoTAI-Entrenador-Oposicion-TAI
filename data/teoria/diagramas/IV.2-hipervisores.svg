    <text x="96.0" y="132.0" font-size="14" text-anchor="middle">Aplicaciones</text>
    <rect x="44.0" y="174.0" width="104.0" height="78.0" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
    <text x="96.0" y="218.0" font-size="14" text-anchor="middle">SO invitado</text>
    <rect x="166.0" y="58" width="120.0" height="204" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="226.0" y="78" font-size="13" text-anchor="middle" fill="#475569" font-weight="600">VM 2</text>
    <rect x="174.0" y="88" width="104.0" height="78.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="226.0" y="132.0" font-size="14" text-anchor="middle">Aplicaciones</text>
