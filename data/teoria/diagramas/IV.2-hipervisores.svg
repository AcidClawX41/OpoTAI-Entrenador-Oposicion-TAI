    <text x="226.0" y="218.0" font-size="14" text-anchor="middle">SO invitado</text>
    <rect x="296.0" y="58" width="120.0" height="204" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="356.0" y="78" font-size="13" text-anchor="middle" fill="#475569" font-weight="600">VM 3</text>
    <rect x="304.0" y="88" width="104.0" height="78.0" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="356.0" y="132.0" font-size="14" text-anchor="middle">Aplicaciones</text>
    <rect x="304.0" y="174.0" width="104.0" height="78.0" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
    <text x="356.0" y="218.0" font-size="14" text-anchor="middle">SO invitado</text>
    <rect x="36" y="270" width="380" height="56" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="226.0" y="296.0" font-size="15" text-anchor="middle" font-weight="700">Hipervisor de tipo 1</text>
    <text x="226.0" y="314.0" font-size="13" text-anchor="middle" fill="#475569">VMware ESXi, Hyper-V, KVM, Xen</text>
    <rect x="36" y="334" width="380" height="50" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="226.0" y="357.0" font-size="15" text-anchor="middle" font-weight="700">Hardware físico</text>
    <text x="226.0" y="375.0" font-size="13" text-anchor="middle" fill="#475569">CPU con VT-x / AMD-V, memoria, discos, red</text>
    <text x="36" y="410" font-size="13" fill="#475569">Sin SO anfitrión: el hipervisor gestiona el hardware.</text>
    <text x="36" y="430" font-size="13" fill="#475569">Uso: centros de datos y servidores.</text>
