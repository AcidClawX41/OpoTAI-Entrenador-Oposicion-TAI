<!-- opotai.diagrams: tools/sources/diagramas/IV.2/hipervisores.svg sha256=d9126ef7ac81688b -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 456" width="900" height="456" role="img" aria-labelledby="t d">
  <title id="t">Hipervisor de tipo 1 frente a tipo 2</title>
  <desc id="d">Tipo 1 (nativo o bare metal): el hipervisor (ESXi, Hyper-V, KVM, Xen) se ejecuta directamente sobre el hardware y sobre él corren las máquinas virtuales, cada una con su sistema operativo invitado y sus aplicaciones. Tipo 2 (alojado): el hipervisor (VirtualBox, VMware Workstation) es una aplicación sobre un sistema operativo anfitrión, junto a las demás aplicaciones del anfitrión, y las máquinas virtuales corren encima.</desc>
  <rect x="0" y="0" width="900" height="456" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#1f2937">
    <rect x="16" y="10" width="420" height="436" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="36" y="40" font-size="17" font-weight="700">Tipo 1 · nativo <tspan font-weight="400" font-style="italic" fill="#475569">(bare metal)</tspan></text>
    <rect x="464" y="10" width="420" height="436" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="484" y="40" font-size="17" font-weight="700">Tipo 2 · alojado <tspan font-weight="400" font-style="italic" fill="#475569">(hosted)</tspan></text>
    <rect x="36.0" y="58" width="120.0" height="204" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
    <text x="96.0" y="78" font-size="13" text-anchor="middle" fill="#475569" font-weight="600">VM 1</text>
