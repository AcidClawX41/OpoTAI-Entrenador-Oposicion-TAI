<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 428" width="900" height="428" role="img" aria-labelledby="t d">
  <title id="t">Árbol binario de búsqueda y sus recorridos</title>
  <desc id="d">Árbol binario de búsqueda con raíz 50; a su izquierda 30, con hijos 20 y 40, y 40 con hijo izquierdo 35; a su derecha 70, con hijos 60 y 80. Preorden (raíz, izquierdo, derecho): 50, 30, 20, 40, 35, 70, 60, 80. Inorden (izquierdo, raíz, derecho): 20, 30, 35, 40, 50, 60, 70, 80, ordenados. Postorden (izquierdo, derecho, raíz): 20, 35, 40, 30, 60, 80, 70, 50. Por niveles: 50, 30, 70, 20, 40, 60, 80, 35.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
