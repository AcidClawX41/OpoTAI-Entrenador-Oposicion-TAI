    <rect x="720" y="440" width="140" height="46" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="790.0" y="468.0" font-size="14" text-anchor="middle">Wi‑Fi invitados</text>
  </g>
</svg>
