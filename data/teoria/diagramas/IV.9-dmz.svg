<!-- opotai.diagrams: tools/sources/diagramas/IV.9/dmz.svg sha256=8a52d0f36f69f7c7 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 534" width="900" height="534" role="img" aria-labelledby="t d">
  <title id="t">Arquitectura perimetral con DMZ</title>
  <desc id="d">Internet llega a un cortafuegos externo (filtrado, anti-DDoS, IPS). Detrás está la DMZ o subred protegida con el proxy inverso o WAF, la pasarela de correo y el DNS público, y en una DMZ dedicada, con sus propios enlaces a los cortafuegos, el concentrador VPN. Un cortafuegos interno, idealmente de otro fabricante, separa la DMZ de la red interna, segmentada en VLAN de usuarios, servidores, administración y Wi-Fi de invitados.</desc>
  <rect x="0" y="0" width="900" height="534" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#1f2937">
    <rect x="30" y="146" width="840" height="156" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="46" y="290" font-size="14" font-weight="700" fill="#b45309">DMZ · subred protegida</text>
    <rect x="30" y="394" width="840" height="130" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="46" y="512" font-size="14" font-weight="700" fill="#047857">Red interna segmentada en VLAN</text>
