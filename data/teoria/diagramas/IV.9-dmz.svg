    <text x="450.0" y="39.0" font-size="15" text-anchor="middle" font-weight="700">Internet</text>
    <rect x="350" y="74" width="200" height="50" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
    <text x="450.0" y="104.0" font-size="15" text-anchor="middle" font-weight="700">Cortafuegos externo</text>
    <text x="336" y="104" font-size="13" fill="#475569" text-anchor="end">filtrado, anti-DDoS, IPS</text>
    <rect x="60" y="196" width="170" height="58" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="145.0" y="222.0" font-size="14" text-anchor="middle" font-weight="700">Proxy inverso / WAF</text>
    <text x="145.0" y="241.0" font-size="13" text-anchor="middle" fill="#475569">web publicada</text>
    <rect x="250" y="196" width="170" height="58" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
    <text x="335.0" y="222.0" font-size="14" text-anchor="middle" font-weight="700">Pasarela de correo</text>
    <text x="335.0" y="241.0" font-size="13" text-anchor="middle" fill="#475569">SMTP entrante</text>
