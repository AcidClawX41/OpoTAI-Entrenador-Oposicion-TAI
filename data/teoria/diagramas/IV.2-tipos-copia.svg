<!-- opotai.diagrams: tools/sources/diagramas/IV.2/tipos-copia.svg sha256=cc035608f69114bc -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 402" width="900" height="402" role="img" aria-labelledby="t d">
  <title id="t">Copias completa, incremental y diferencial</title>
  <desc id="d">Completa el domingo y copias diarias de lunes a miércoles; el jueves falla el disco. Con incrementales, cada copia guarda solo los cambios de su día y para restaurar hacen falta la completa y las tres incrementales (4 juegos, en orden). Con diferenciales, cada copia acumula todos los cambios desde la completa y basta la completa más la diferencial del miércoles (2 juegos).</desc>
  <rect x="0" y="0" width="900" height="402" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#1f2937">
    <g font-size="14" font-weight="700" fill="#475569" text-anchor="middle">
    <text x="238.0" y="34">domingo</text>
    <text x="348.0" y="34">lunes</text>
    <text x="458.0" y="34">martes</text>
    <text x="568.0" y="34">miércoles</text>
    <text x="640" y="34" fill="#e11d48">jueves</text>
    <text x="770" y="34">para restaurar</text>
    </g>
    <rect x="16" y="56" width="868" height="108" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="30" y="96" font-size="16" font-weight="700">Incremental</text>
    <text x="30" y="118" font-size="13" fill="#475569">desde la última copia</text>
    <text x="30" y="136" font-size="13" fill="#475569">de cualquier tipo</text>
    <g><rect x="190" y="66" width="96" height="88" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="238.0" y="115.0" font-size="14" text-anchor="middle" font-weight="600">Completa</text></g>
    <g><rect x="300" y="126" width="96" height="28" rx="5" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/><text x="348.0" y="145.0" font-size="14" text-anchor="middle" font-weight="600">cambios L</text></g>
    <g><rect x="410" y="126" width="96" height="28" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/><text x="458.0" y="145.0" font-size="14" text-anchor="middle" font-weight="600">cambios M</text></g>
    <g><rect x="520" y="126" width="96" height="28" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="568.0" y="145.0" font-size="14" text-anchor="middle" font-weight="600">cambios X</text></g>
    <text x="672" y="106" font-size="14" font-weight="700">completa + L + M + X</text>
    <text x="672" y="128" font-size="14" fill="#475569">4 juegos, en orden</text>
    <rect x="16" y="180" width="868" height="108" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="30" y="220" font-size="16" font-weight="700">Diferencial</text>
    <text x="30" y="242" font-size="13" fill="#475569">desde la última</text>
    <text x="30" y="260" font-size="13" fill="#475569">copia completa</text>
    <g><rect x="190" y="190" width="96" height="88" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="238.0" y="239.0" font-size="14" text-anchor="middle" font-weight="600">Completa</text></g>
    <g opacity="0.4"><rect x="300" y="250" width="96" height="28" rx="5" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/><text x="348.0" y="269.0" font-size="14" text-anchor="middle" font-weight="600">L</text></g>
    <g opacity="0.4"><rect x="410" y="250" width="96" height="28" rx="5" fill="#cffafe" stroke="#0891b2" stroke-width="1.2"/><text x="458.0" y="269.0" font-size="14" text-anchor="middle" font-weight="600">L</text></g>
    <g opacity="0.4"><rect x="410" y="222" width="96" height="28" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/><text x="458.0" y="241.0" font-size="14" text-anchor="middle" font-weight="600">M</text></g>
    <g><rect x="520" y="250" width="96" height="28" rx="5" fill="#cffafe" stroke="#0891b2" stroke-width="2.5"/><text x="568.0" y="269.0" font-size="14" text-anchor="middle" font-weight="600">L</text></g>
    <g><rect x="520" y="222" width="96" height="28" rx="5" fill="#d1fae5" stroke="#059669" stroke-width="2.5"/><text x="568.0" y="241.0" font-size="14" text-anchor="middle" font-weight="600">M</text></g>
    <g><rect x="520" y="194" width="96" height="28" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/><text x="568.0" y="213.0" font-size="14" text-anchor="middle" font-weight="600">X</text></g>
    <text x="672" y="230" font-size="14" font-weight="700">completa + diferencial</text>
    <text x="672" y="252" font-size="14" fill="#475569">del miércoles: 2 juegos</text>
    <path d="M640 44 L640 296" stroke="#e11d48" stroke-width="2" stroke-dasharray="6 5"/>
    <rect x="596" y="300" width="88" height="24" rx="6" fill="#ffe4e6" stroke="#e11d48"/>
    <text x="640" y="317" font-size="13" text-anchor="middle" fill="#9f1239" font-weight="600">falla el disco</text>
    <rect x="30" y="342" width="18" height="18" rx="4" fill="#ede9fe" stroke="#7c3aed"/>
    <text x="56" y="356" font-size="14">completa (todo)</text>
    <rect x="197.0" y="342" width="18" height="18" rx="4" fill="#cffafe" stroke="#0891b2"/>
    <text x="223.0" y="356" font-size="14">cambios del lunes</text>
    <rect x="378.8" y="342" width="18" height="18" rx="4" fill="#d1fae5" stroke="#059669"/>
    <text x="404.8" y="356" font-size="14">del martes</text>
    <rect x="508.8" y="342" width="18" height="18" rx="4" fill="#fef3c7" stroke="#d97706"/>
    <text x="534.8" y="356" font-size="14">del miércoles</text>
    <text x="30" y="386" font-size="13" fill="#475569">Bit de archivo: la completa y la incremental lo desmarcan; la diferencial no. Borde grueso: copias necesarias. RPO de un día.</text>
  </g>
</svg>
