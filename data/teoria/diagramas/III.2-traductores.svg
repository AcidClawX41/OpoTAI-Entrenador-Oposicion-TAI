<!-- opotai.diagrams: tools/sources/diagramas/III.2/traductores.svg sha256=72936df07a391eab -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 628" width="900" height="628" role="img" aria-labelledby="t d">
  <title id="t">Compilación, interpretación y máquina virtual</title>
  <desc id="d">Compilado: el código fuente pasa por el preprocesador y por el compilador, cuyo front-end hace el análisis léxico, sintáctico y semántico y cuyo back-end genera código intermedio, lo optimiza y genera el código, con una tabla de símbolos compartida; el código objeto resultante lo une el enlazador con las bibliotecas en un ejecutable nativo, que el cargador lleva a memoria para que lo ejecute la CPU. Híbrido: javac compila Main.java a bytecode (.class), que la JVM interpreta y compila con JIT a código máquina; en .NET, CIL y CLR. Interpretado: el intérprete analiza y ejecuta el script instrucción a instrucción, sin generar ejecutable.</desc>
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
  </defs>
