<!-- opotai.diagrams: tools/sources/diagramas/III.1/normalizacion.svg sha256=22091abeed544e2c -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 762" width="900" height="762" font-family="Inter, system-ui, sans-serif" role="img" aria-labelledby="titulo desc">
  <title id="titulo">Normalización de la 1FN a la 3FN</title>
  <desc id="desc">Una tabla de préstamos con teléfonos repetidos se descompone en 1FN (sale el teléfono), en 2FN (salen SOCIO y LIBRO por dependencias parciales) y en 3FN (sale EDITORIAL por la dependencia transitiva), que además está en FNBC.</desc>
  <defs><marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker></defs>
  <rect x="0" y="0" width="900" height="762" rx="14" fill="#ffffff"/>
  <text x="30" y="40" font-size="21" font-weight="700" fill="#1f2937">Normalización paso a paso: préstamos de una biblioteca</text>
  <text x="30" y="62" font-size="13" fill="#475569">Dependencias funcionales: num_socio → nombre_socio · cod_libro → titulo, cod_editorial · cod_editorial → nombre_editorial</text>
  <text x="30" y="80" font-size="13" fill="#475569">(num_socio, cod_libro, fecha_prestamo) → fecha_devolucion · un socio puede tener varios teléfonos</text>
  <rect x="30" y="96" width="180" height="80" rx="8" fill="#f8fafc"/>
  <text x="40" y="117" font-size="15" font-weight="700" fill="#1f2937">Sin forma normal</text>
  <text x="40" y="136" font-size="13" fill="#1f2937">«telefonos» guarda</text>
  <text x="40" y="152" font-size="13" fill="#1f2937">varios valores en</text>
  <text x="40" y="168" font-size="13" fill="#1f2937">un mismo campo</text>
  <line x1="216" y1="136" x2="244" y2="136" stroke="#1f2937" stroke-width="1.8" marker-end="url(#flecha)"/>
  <rect x="250" y="96" width="180" height="80" rx="8" fill="#f8fafc"/>
  <text x="260" y="117" font-size="15" font-weight="700" fill="#1f2937">1FN</text>
  <text x="260" y="136" font-size="13" fill="#1f2937">sin grupos repetitivos,</text>
  <text x="260" y="152" font-size="13" fill="#1f2937">pero con dependencias</text>
  <text x="260" y="168" font-size="13" fill="#1f2937">parciales</text>
  <line x1="436" y1="136" x2="464" y2="136" stroke="#1f2937" stroke-width="1.8" marker-end="url(#flecha)"/>
  <rect x="470" y="96" width="180" height="80" rx="8" fill="#f8fafc"/>
  <text x="480" y="117" font-size="15" font-weight="700" fill="#1f2937">2FN</text>
  <text x="480" y="136" font-size="13" fill="#1f2937">sin dependencias</text>
  <text x="480" y="152" font-size="13" fill="#1f2937">parciales, pero con</text>
  <text x="480" y="168" font-size="13" fill="#1f2937">una transitiva</text>
  <line x1="656" y1="136" x2="684" y2="136" stroke="#1f2937" stroke-width="1.8" marker-end="url(#flecha)"/>
  <rect x="690" y="96" width="180" height="80" rx="8" fill="#f8fafc"/>
  <text x="700" y="117" font-size="15" font-weight="700" fill="#1f2937">3FN (y FNBC)</text>
  <text x="700" y="136" font-size="13" fill="#1f2937">cada atributo depende</text>
  <text x="700" y="152" font-size="13" fill="#1f2937">de la clave, de toda</text>
  <text x="700" y="168" font-size="13" fill="#1f2937">y solo de la clave</text>
