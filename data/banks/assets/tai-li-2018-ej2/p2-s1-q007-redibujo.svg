<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 290" width="940" height="290" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Reconstrucción de OpoTAI: diagrama de clases de la pregunta 7</title>
  <desc id="descripcion">Redibujo del diagrama escaneado: CLIENTE (recuadro discontinuo) apunta con una línea discontinua y punta de flecha rellena a la clase ELEMENTO (operación Petición()); ELEMENTO REAL y APODERADO, ambas con Petición(), heredan de ELEMENTO (triángulo hueco); APODERADO apunta a ELEMENTO REAL con una asociación rotulada «Elemento Real»; un círculo junto a Petición() de APODERADO se une con una línea discontinua a una nota con «ElementoReal -&gt; Petición()» entre dos líneas de puntos.</desc>
