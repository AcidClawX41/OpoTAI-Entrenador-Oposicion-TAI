  <title id="titulo">Reconstrucción de OpoTAI: borrador del modelo entidad/relación extendido del nuevo sistema</title>
  <desc id="descripcion">Redibujo del diagrama escaneado: Trabajador se une a «Relación 1» (rotulada 1:N encima), que lleva a UbicacionCentral, y a «Relación 2» (rotulada 1:1 debajo), que lleva a UbicacionExterior; un arco junto a Trabajador cruza las dos líneas. UbicacionCentral y UbicacionExterior se unen con un corchete al vértice de un triángulo cuya base se une a Ubicacion, que tiene los atributos Telefono y Direccion (elipses).</desc>
