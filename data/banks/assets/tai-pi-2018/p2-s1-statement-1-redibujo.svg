<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 938 565" width="938" height="565" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Reconstrucción de OpoTAI: borrador inicial del diagrama E/R extendido de la aplicación</title>
  <desc id="descripcion">Redibujo del diagrama escaneado, sin cardinalidades: la entidad Usuario (atributo NIF) tiene la relación reflexiva «Es responsable de» y se une por «Hace» con Pedido (atributos Aprobado y Fecha); Pedido se une por «Tiene» (atributo Cantidad) con Artículo (atributos Stock, Desc. y Límite Máx.). Usuario se une con una línea discontinua a un triángulo «ES UN» (con un pequeño óvalo relleno en su lado superior) del que salen líneas a Gestor y a Solicitante.</desc>
