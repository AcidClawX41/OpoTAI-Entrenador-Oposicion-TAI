name: CI

# En las ramas de trabajo se lanza a mano (workflow_dispatch) o al abrir un PR, para que las
# instantáneas intermedias no generen ejecuciones en rojo.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  datos:
    name: Datos · validación de bancos y metadatos
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0  # sin etiqueta mayor flotante desde v8
        with:
          working-directory: tools
      - name: Validar data/ (JSON Schema + coherencia)
        working-directory: tools
        run: |
          uv sync --frozen
          uv run python -m opotai.validate
      - name: Diagramas de la teoría (al día, seguros y citados)
        working-directory: tools
        run: uv run python -m opotai.diagrams --check
      - name: Auditoría de contenido (estructura, respuestas, imágenes, teoría)
        working-directory: tools
        run: uv run python qa/audit_contenido.py
      - name: Versión única (Cargo, Tauri e interfaz)
        working-directory: tools
        run: uv run python qa/version.py check
      - name: Cabeceras de licencia (SPDX) en el código
        working-directory: tools
        run: uv run python qa/spdx_headers.py --check
      - name: Tests de las herramientas
        working-directory: tools
        run: uv run pytest -q

  nucleo:
    name: Núcleo Rust · tai-core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p tai-core --all-targets -- -D warnings
      - run: cargo test -p tai-core

  app:
    name: App · interfaz + Tauri (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Dependencias de sistema (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Interfaz · instalar, tipos, tests y build
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Clippy (workspace completo)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (workspace completo)
        run: cargo test --workspace
