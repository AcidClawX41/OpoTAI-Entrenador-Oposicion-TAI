name: Instaladores (Windows x64 · Linux x64 · macOS Apple Silicon)

# Ejecutables e instaladores de OpoTAI para los tres sistemas:
#   - Windows x64: instalador .msi, instalador -setup.exe (NSIS) y .exe portable.
#   - Linux x64: .deb, .rpm y .AppImage.
#   - macOS Apple Silicon (arm64): .dmg con la app (firma ad-hoc, sin cuenta de Apple).
# Cuándo se ejecuta:
#   - Al empujar una etiqueta vX.Y.Z[-rc.N]: crea la release (texto de docs/notas-version/vX.Y.Z.md si
#     existe), adjunta los instaladores de los tres sistemas y la PUBLICA al terminar los tres (las
#     vX.Y.Z-rc.N quedan como pre-release). Si alguna compilación falla, se queda en borrador.
#   - Al cambiar `.github/compilar-instaladores` en cualquier rama: solo compila y deja los
#     ejecutables como artefactos privados del workflow (para probar sin publicar nada).
#   - A mano (workflow_dispatch, cuando el workflow esté en la rama principal): igual que el
#     anterior, salvo que se marque «publish».

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    # En las ramas solo cuando se pide una compilación (en las etiquetas no se evalúa).
    paths: [".github/compilar-instaladores"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Crear también un borrador de release en GitHub"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Solo con etiqueta: crea la release (borrador) antes de compilar, para que los tres sistemas
  # adjunten sus ficheros a la MISMA release (sin duplicados).
  crear-release:
    name: Crear la release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.crear.outputs.id }}
    steps:
      - uses: actions/checkout@v7
      - name: Crear borrador con las notas de la versión
        id: crear
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notas="docs/notas-version/${TAG}.md"
          if [ ! -f "$notas" ]; then
            notas="$RUNNER_TEMP/notas.md"
            printf '%s\n' "OpoTAI ${TAG} · entrenador de la oposición TAI (AGE) · por Eric Valls Gramunt." \
              "" "Instaladores para Windows x64, Linux x64 y macOS Apple Silicon adjuntos más abajo." > "$notas"
          fi
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft=true --notes-file "$notas"
          else
            gh release create "$TAG" --draft $pre --verify-tag --title "OpoTAI ${TAG#v}" --notes-file "$notas"
          fi
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: crear-release
    # Sin etiqueta, «crear-release» se omite y los instaladores se compilan igualmente.
    if: ${{ !cancelled() && (needs.crear-release.result == 'success' || needs.crear-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rust_targets: ""
            args: ""
          - name: Linux x64
            platform: ubuntu-22.04
            rust_targets: ""
            args: ""
          - name: macOS Apple Silicon (arm64)
            platform: macos-latest
            rust_targets: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good  # sonidos (WebAudio) dentro del AppImage

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2

      - name: Instalar dependencias de la interfaz
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Compilar y adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          # Con etiqueta, se adjunta a la release que creó «crear-release»; lanzado a mano con
          # «publish», tauri-action crea un borrador con la versión de la app.
          releaseId: ${{ needs.crear-release.outputs.id }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "OpoTAI ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          # En Windows se publica también el .exe portable (los datos van embebidos en el binario).
          uploadPlainBinary: ${{ runner.os == 'Windows' }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "OpoTAI-[platform]-[arch]-[bundle]"

      - name: Compilar (solo artefactos del workflow)
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || inputs.publish) }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          uploadPlainBinary: ${{ runner.os == 'Windows' }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "OpoTAI-[platform]-[arch]-[bundle]"

  # Solo con etiqueta y si los tres sistemas compilaron: publica la release (deja de ser borrador).
  publicar:
    name: Publicar la release
    needs: [crear-release, build]
    if: startsWith(github.ref, 'refs/tags/') && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-*) gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease ;;
            *)   gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest ;;
          esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name'
