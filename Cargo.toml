[workspace]
resolver = "3"
members = ["crates/tai-core", "app/src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
authors = ["Eric Valls Gramunt"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AcidClawX41/Programa-Oposiciones-TAI"
homepage = "https://github.com/AcidClawX41/Programa-Oposiciones-TAI"

[workspace.dependencies]
tai-core = { path = "crates/tai-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.10"
rand_chacha = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
include_dir = "0.7"
log = "0.4"
base64 = "0.22"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "abort"
