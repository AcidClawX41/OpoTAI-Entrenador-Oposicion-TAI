[project]
name = "opotai-tools"
version = "0.1.0"
description = "OpoTAI · Herramientas de datos: descarga de fuentes oficiales, extracción de PDFs y validación de bancos de preguntas."
authors = [{ name = "Eric Valls Gramunt" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "lxml>=5.3",
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "pymupdf>=1.24",
    "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
