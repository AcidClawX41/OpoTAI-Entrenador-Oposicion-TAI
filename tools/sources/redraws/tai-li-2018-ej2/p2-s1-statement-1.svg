      <rect x="402.3" y="14.0" width="250.8" height="34.1" fill="#7c3aed" stroke="#1f2937" stroke-width="1.6"/>
      <text x="411.3" y="38.1" font-weight="700" fill="#ffffff">PETICIONES</text>
      <path d="M402.3 81.1H653.1M402.3 114.1H653.1M402.3 147.1H653.1M402.3 181.2H653.1" stroke="#1f2937" stroke-width="1"/>
