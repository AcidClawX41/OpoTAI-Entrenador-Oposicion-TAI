<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 886 462" width="886" height="462" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Reconstrucción de OpoTAI: tablas de la base de datos antigua (USUARIOS, PETICIONES, TRABAJADORES y UBICACIONES)</title>
  <desc id="descripcion">Redibujo del diagrama escaneado: cuatro tablas con su cabecera; claves primarias en negrita con «(PK)»; cada tabla termina en una fila «...». Líneas: USUARIOS.IdUsuario (PK) con PETICIONES.IdCliente; TRABAJADORES.CodTrabajador (PK) con UBICACIONES.Director; TRABAJADORES.Ubicacion con UBICACIONES.Ubicacion (PK) (las dos últimas se cruzan).</desc>
  <rect x="1" y="1" width="884" height="460" rx="14" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937">
