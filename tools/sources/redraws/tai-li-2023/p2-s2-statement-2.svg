<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Reconstrucción de OpoTAI: Modelo B (red segmentada en cuatro subredes)</title>
  <desc id="descripcion">Redibujo del esquema del cuadernillo: la nube INTERNET se une a un Router conectado a la Subred de DMZ (rótulo DMZ). La Subred de DMZ llega a un par de cortafuegos (rótulo Clúster Firewalls), que se unen también a la Subred de PCs de Usuario (cuatro PCs encima; rótulo PCs Usuarios), a la Subred de Aplicaciones (tres servidores debajo; rótulo Aplicaciones) y a la Subred de Bases de Datos (dos servidores de base de datos debajo; rótulo Bases de Datos).</desc>
