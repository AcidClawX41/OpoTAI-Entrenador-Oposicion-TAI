<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 713" width="900" height="713" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Reconstrucción de OpoTAI: diagrama de la red e infraestructura del organismo</title>
  <desc id="descripcion">Redibujo del diagrama escaneado: la nube INTERNET se une a ROUTER_INTERNET_1 y ROUTER_INTERNET_2, conectados a una línea troncal que llega a un primer cortafuegos. La nube RED SARA se une a ROUTER_SARA_1 y ROUTER_SARA_2, cuyas salidas se juntan en una línea vertical que llega también a ese cortafuegos. Del cortafuegos sale la RED DE SERVIDORES, con el SISTEMA DE VIRTUALIZACIÓN, un servidor con el pingüino de Linux y un servidor con el logotipo ORACLE. Un segundo cortafuegos, debajo del primero, da paso a la RED DE USUARIOS, con tres puestos de trabajo. Hay además algunos tramos de conexión sueltos, como en el original.</desc>
