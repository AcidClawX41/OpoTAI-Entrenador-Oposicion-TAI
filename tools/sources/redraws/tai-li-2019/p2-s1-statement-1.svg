<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 360" width="892" height="360" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Reconstrucción de OpoTAI: modelo Entidad-Relación extendido inacabado</title>
  <desc id="descripcion">Redibujo del modelo escaneado: Ciudadano (identificador NIF) se une a una relación sin nombre con AccionFormativa (identificador idAccionFormativa; atributos denominacion y numAlumnos), que se une a otra relación sin nombre con Aula (identificador idAula; atributos nomAula y numplazas). De AccionFormativa baja una doble línea a un triángulo del que salen líneas a Curso (horasTeoricas, horasPracticas) y Taller (especialidad, material). Sin cardinalidades. Los identificadores llevan el círculo relleno.</desc>
