  <title id="titulo">Reconstrucción de OpoTAI: modelo Entidad-Relación extendido inacabado del registro de estacionamiento</title>
  <desc id="descripcion">Redibujo del modelo escaneado, con las cardinalidades rotuladas: Municipio (1) – Calle (1..N); Calle (1) – TramoCalle (1..N); FranjaHoraria (¿?) – TipoZona (¿?); TipoZona (1) – Tarifa (1); TipoZona (¿?) – TramoCalle (¿?). Las relaciones son rombos sin nombre. Atributos: Municipio (idMunicipio, nombre), FranjaHoraria (idFranja, horaInicio, horaFin, diaSem), Calle (idCalle, nombre), TipoZona (idZona, nombre, tiempoMin, tiempoMax), Tarifa (idTarifa, precio), TramoCalle (idTramoCalle, desde, hasta, parImpar); el identificador de cada entidad lleva la marca rellena.</desc>
