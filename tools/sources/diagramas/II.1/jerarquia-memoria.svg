<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 478" width="900" height="478" role="img" aria-labelledby="t d">
  <title id="t">Jerarquía de memoria</title>
  <desc id="d">Pirámide de siete niveles, de arriba abajo: registros, caché L1, caché L2, caché L3, memoria principal (DRAM, volátil), almacenamiento secundario (SSD y HDD) y almacenamiento terciario (cinta y óptico). Hacia arriba la memoria es más rápida, más cara por bit y más pequeña; hacia abajo, más lenta, más barata y de más capacidad.</desc>
  <rect x="0" y="0" width="900" height="478" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#1f2937">
    <polygon points="275.0,30 385.0,30 422.9,82 237.1,82" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="330" y="61.0" font-size="14" font-weight="700" text-anchor="middle">Registros</text>
    <line x1="409.9" y1="56.0" x2="656" y2="56.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="664" y="61.0" font-size="13" fill="#475569">bytes · dentro de la CPU</text>
    <polygon points="237.1,86 422.9,86 460.7,138 199.3,138" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="330" y="117.0" font-size="15" font-weight="700" text-anchor="middle">Caché L1</text>
    <line x1="447.8" y1="112.0" x2="656" y2="112.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="664" y="117.0" font-size="13" fill="#475569">decenas de KiB · SRAM, por núcleo</text>
    <polygon points="199.3,142 460.7,142 498.6,194 161.4,194" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="330" y="173.0" font-size="15" font-weight="700" text-anchor="middle">Caché L2</text>
    <line x1="485.6" y1="168.0" x2="656" y2="168.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="664" y="173.0" font-size="13" fill="#475569">cientos de KiB a pocos MiB</text>
    <polygon points="161.4,198 498.6,198 536.4,250 123.6,250" fill="#cffafe" stroke="#0891b2" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="330" y="229.0" font-size="15" font-weight="700" text-anchor="middle">Caché L3</text>
    <line x1="523.5" y1="224.0" x2="656" y2="224.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="664" y="229.0" font-size="13" fill="#475569">varios MiB · compartida</text>
    <polygon points="123.6,254 536.4,254 574.3,306 85.7,306" fill="#d1fae5" stroke="#059669" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="330" y="285.0" font-size="15" font-weight="700" text-anchor="middle">Memoria principal</text>
    <line x1="561.4" y1="280.0" x2="656" y2="280.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="664" y="285.0" font-size="13" fill="#475569">GiB · DRAM, volátil</text>
    <polygon points="85.7,310 574.3,310 612.1,362 47.9,362" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="330" y="341.0" font-size="15" font-weight="700" text-anchor="middle">Almacenamiento secundario</text>
    <line x1="599.2" y1="336.0" x2="656" y2="336.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="664" y="341.0" font-size="13" fill="#475569">TB · SSD y HDD, no volátil</text>
    <polygon points="47.9,366 612.1,366 650.0,418 10.0,418" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5" stroke-linejoin="round"/>
    <text x="330" y="397.0" font-size="15" font-weight="700" text-anchor="middle">Almacenamiento terciario</text>
    <line x1="637.1" y1="392.0" x2="656" y2="392.0" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3 3"/>
    <text x="664" y="397.0" font-size="13" fill="#475569">cinta y óptico · copias y archivo</text>
    <defs><marker id="pf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
    <path d="M40 272 L40 40" stroke="#475569" stroke-width="2" marker-end="url(#pf)"/>
    <text x="52" y="54" font-size="13" fill="#475569">más rápida,</text>
    <text x="52" y="72" font-size="13" fill="#475569">más cara por bit</text>
    <text x="52" y="90" font-size="13" fill="#475569">y más pequeña</text>
    <text x="330" y="444" font-size="13" fill="#475569" text-anchor="middle">hacia abajo: más lenta, más barata por bit y de más capacidad</text>
    <text x="330" y="464" font-size="13" fill="#475569" text-anchor="middle">funciona gracias al principio de localidad (temporal y espacial)</text>
  </g>
</svg>
