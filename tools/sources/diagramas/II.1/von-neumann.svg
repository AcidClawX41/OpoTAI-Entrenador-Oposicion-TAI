<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 418" width="900" height="418" role="img" aria-labelledby="t d">
  <title id="t">Arquitecturas de Von Neumann y Harvard</title>
  <desc id="d">Von Neumann: la CPU (unidad de control, ALU y registros), la memoria principal con instrucciones y datos juntos y la entrada/salida se comunican por un único bus del sistema (datos, direcciones y control); instrucciones y datos compiten por él, el cuello de botella de Von Neumann. Harvard: memoria de instrucciones y memoria de datos separadas, cada una con su bus hacia la CPU, de modo que se leen a la vez.</desc>
  <rect x="0" y="0" width="900" height="418" fill="#ffffff"/>
  <g font-family="Inter, system-ui, sans-serif" fill="#1f2937">
    <rect x="12" y="12" width="526" height="394" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="552" y="12" width="336" height="394" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="30" y="42" font-size="17" fill="#1f2937" text-anchor="start" font-weight="700">Von Neumann (1945)</text>
    <text x="570" y="42" font-size="17" fill="#1f2937" text-anchor="start" font-weight="700">Harvard</text>
    <rect x="32" y="62" width="220" height="214" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="142" y="86" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700">CPU</text>
    <rect x="48" y="98" width="188" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="142.0" y="119.0" font-size="14" text-anchor="middle" font-weight="700">Unidad de control</text>
    <text x="142.0" y="138.0" font-size="13" text-anchor="middle" fill="#475569">busca, decodifica, ejecuta</text>
    <rect x="48" y="156" width="188" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="142.0" y="177.0" font-size="14" text-anchor="middle" font-weight="700">ALU</text>
    <text x="142.0" y="196.0" font-size="13" text-anchor="middle" fill="#475569">aritmética y lógica</text>
    <rect x="48" y="214" width="188" height="48" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="142.0" y="235.0" font-size="14" text-anchor="middle" font-weight="700">Registros</text>
    <text x="142.0" y="254.0" font-size="13" text-anchor="middle" fill="#475569">PC, IR, acumulador…</text>
    <rect x="312" y="62" width="206" height="96" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="415.0" y="107.0" font-size="15" text-anchor="middle" font-weight="700">Memoria principal</text>
    <text x="415.0" y="126.0" font-size="13" text-anchor="middle" fill="#475569">instrucciones y datos juntos</text>
    <rect x="312" y="180" width="206" height="96" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="415.0" y="225.0" font-size="15" text-anchor="middle" font-weight="700">Entrada / salida</text>
    <text x="415.0" y="244.0" font-size="13" text-anchor="middle" fill="#475569">periféricos</text>
    <rect x="32" y="306" width="486" height="40" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <text x="275" y="331" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="700">Bus del sistema: datos · direcciones · control</text>
    <line x1="142" y1="276" x2="142" y2="306" stroke="#64748b" stroke-width="5"/>
    <line x1="415" y1="276" x2="415" y2="306" stroke="#64748b" stroke-width="5"/>
    <path d="M518 110 L534 110 L534 326 L518 326" fill="none" stroke="#64748b" stroke-width="5" stroke-linejoin="round"/>
    <text x="30" y="372" font-size="13" fill="#475569" text-anchor="start">Programa almacenado: instrucciones y datos comparten memoria y bus;</text>
    <text x="30" y="392" font-size="13" fill="#475569" text-anchor="start">compiten por él → cuello de botella de Von Neumann.</text>
    <rect x="568" y="62" width="150" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="643.0" y="94.0" font-size="15" text-anchor="middle" font-weight="700">Memoria de</text>
    <text x="643.0" y="113.0" font-size="13" text-anchor="middle" fill="#475569">instrucciones</text>
    <rect x="726" y="62" width="150" height="70" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <text x="801.0" y="94.0" font-size="15" text-anchor="middle" font-weight="700">Memoria de</text>
    <text x="801.0" y="113.0" font-size="13" text-anchor="middle" fill="#475569">datos</text>
    <rect x="628" y="214" width="190" height="72" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="723" y="246" font-size="16" fill="#1f2937" text-anchor="middle" font-weight="700">CPU</text>
    <text x="723" y="268" font-size="13" fill="#475569" text-anchor="middle">UC, ALU y registros</text>
    <line x1="660" y1="132" x2="660" y2="214" stroke="#2563eb" stroke-width="5"/>
    <line x1="786" y1="132" x2="786" y2="214" stroke="#d97706" stroke-width="5"/>
    <text x="652" y="168" font-size="13" fill="#1d4ed8" text-anchor="end">bus de</text>
    <text x="652" y="186" font-size="13" fill="#1d4ed8" text-anchor="end">instrucciones</text>
    <text x="794" y="168" font-size="13" fill="#b45309" text-anchor="start">bus de</text>
    <text x="794" y="186" font-size="13" fill="#b45309" text-anchor="start">datos</text>
    <text x="570" y="322" font-size="13" fill="#475569" text-anchor="start">Memorias y buses separados: lee la</text>
    <text x="570" y="342" font-size="13" fill="#475569" text-anchor="start">instrucción y el dato a la vez.</text>
    <text x="570" y="372" font-size="13" fill="#475569" text-anchor="start">Microcontroladores y DSP; las CPU actuales</text>
    <text x="570" y="392" font-size="13" fill="#475569" text-anchor="start">separan solo la caché L1 (Harvard modificada).</text>
  </g>
</svg>
