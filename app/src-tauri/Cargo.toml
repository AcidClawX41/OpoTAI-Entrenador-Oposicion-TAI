[package]
name = "opotai"
description = "OpoTAI · Entrenador de tests y simulacros para la oposición TAI (AGE)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
default-run = "opotai"

[lib]
name = "opotai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tai-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
include_dir.workspace = true
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
tauri-plugin-log = "2.9"
